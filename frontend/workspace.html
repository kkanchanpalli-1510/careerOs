<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career OS — Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── Design system variables ────────────────────────────────────────────── */
:root {
  /* Full names (match career-os-interactive.html) */
  --bg:       #08090f;
  --surface:  #0f1018;
  --surface2: #141622;
  --border:   #1a1e30;
  --border2:  #232840;
  --text:     #d0daf0;
  --text2:    #6b7fa3;
  --text3:    #2e3d5a;
  --accent:   #e8a640;
  --green:    #10b981;
  --blue:     #3b82f6;
  --purple:   #8b5cf6;

  /* Shorthand aliases used in workspace spec CSS */
  --s1:   var(--surface);
  --s2:   var(--surface2);
  --b1:   var(--border);
  --b2:   var(--border2);
  --b3:   #2e3a52;
  --t1:   var(--text);
  --t2:   var(--text2);
  --t3:   var(--text3);
  --t4:   #1a2640;
  --gold: var(--accent);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* Grid background */
body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(26,30,48,0.6) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,30,48,0.6) 1px, transparent 1px);
  background-size: 52px 52px;
}

/* ── Workspace layout ───────────────────────────────────────────────────── */
#workspace {
  display: grid;
  grid-template-columns: 200px 1fr;
  grid-template-rows: 44px 1fr;
  height: 100vh;
  background: var(--bg);
  position: relative; z-index: 1;
}

/* Top bar spans full width */
#workspaceTopbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  padding: 0 16px;
  border-bottom: 1px solid var(--b1);
  background: var(--s1);
  gap: 12px;
}

/* Left nav */
#workspaceNav {
  border-right: 1px solid var(--b1);
  background: var(--s1);
  padding: 12px 0;
  overflow-y: auto;
}

/* Main panel */
#mainPanel {
  overflow-y: auto;
  padding: 24px 32px;
}

/* ── Nav items ──────────────────────────────────────────────────────────── */
.nav-section-label {
  font-family: 'DM Mono', monospace;
  font-size: 7px;
  color: var(--t4);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 10px 16px 4px;
}

.nav-sep {
  height: 1px;
  background: var(--b1);
  margin: 8px 12px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  cursor: pointer;
  transition: background 0.15s;
  border-radius: 0;
  position: relative;
}

.nav-item:hover { background: rgba(255,255,255,0.02); }

.nav-item.active {
  background: rgba(255,255,255,0.03);
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 2px;
  background: var(--gold);
  border-radius: 0 2px 2px 0;
}

.nav-icon {
  font-size: 10px;
  width: 14px;
  text-align: center;
  flex-shrink: 0;
}

.nav-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--t2);
  flex: 1;
}

.nav-item.active .nav-label { color: var(--t1); }

.nav-badge {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--t3);
  background: var(--s2);
  border: 1px solid var(--b1);
  padding: 1px 5px;
  border-radius: 3px;
}

.nav-external {
  font-size: 9px;
  color: var(--t4);
}

/* ── Panel loading state ────────────────────────────────────────────────── */
.panel-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 200px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--t4);
  letter-spacing: 0.2em;
}

/* ── Graph back button ──────────────────────────────────────────────────── */
#graphBackBtn {
  position: fixed;
  top: 10px; left: 16px;
  z-index: 100;
  display: none;
  align-items: center;
  gap: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--t2);
  background: rgba(0,0,0,0.8);
  border: 1px solid var(--b2);
  padding: 5px 12px;
  border-radius: 3px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: all 0.15s;
}

#graphBackBtn:hover { color: var(--t1); border-color: var(--b3); }

/* ── Topbar branding ────────────────────────────────────────────────────── */
.topbar-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}

.topbar-mark {
  width: 22px; height: 22px;
  border: 1.5px solid var(--gold);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  position: relative; flex-shrink: 0;
}
.topbar-mark::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--gold);
  border-radius: 50%;
}
.topbar-mark::after {
  content: '';
  position: absolute;
  width: 1.5px; height: 10px;
  background: var(--gold);
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) rotate(45deg);
  opacity: 0.4;
}

.topbar-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px; font-weight: 400;
  color: var(--t1);
  letter-spacing: 0.01em;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.topbar-avatar {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--t3);
  letter-spacing: 0.06em;
  border: 1px solid var(--b2);
  padding: 3px 8px;
  border-radius: 3px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.topbar-avatar:hover { color: var(--t2); border-color: var(--b3); }

/* ── Graph container (full-screen) ──────────────────────────────────────── */
#graphContainer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--bg);
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.graph-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  color: var(--t3);
}

.graph-placeholder-icon {
  width: 64px; height: 64px;
  border: 1px dashed var(--b2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
}

.graph-placeholder-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  text-align: center;
  line-height: 1.8;
  letter-spacing: 0.04em;
}

/* ── Nudge banner (reserved slot) ───────────────────────────────────────── */
.nudge-banner {
  grid-column: 1 / -1;
  /* populated by doc 12c */
}

/* ── Panel layout ───────────────────────────────────────────────────────── */
.panel-header {
  margin-bottom: 20px;
}

.panel-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--t1);
  letter-spacing: 0.01em;
  margin-bottom: 4px;
}

.panel-use-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--t3);
  letter-spacing: 0.06em;
}

.panel-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.action-btn {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.06em;
  padding: 5px 12px;
  border-radius: 3px;
  border: 1px solid var(--b2);
  background: none;
  color: var(--t2);
  cursor: pointer;
  transition: all 0.15s;
}

.action-btn:hover { border-color: var(--b3); color: var(--t1); }

.action-btn.muted { color: var(--t3); }
.action-btn.muted:hover { color: var(--t2); }

/* ── Output text ────────────────────────────────────────────────────────── */
.output-text {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  line-height: 1.7;
  color: var(--t1);
  white-space: pre-wrap;
  word-break: break-word;
  padding: 2px 0;
  border-left: 2px solid transparent;
  transition: border-color 0.15s, padding-left 0.15s, margin-left 0.15s;
}

.output-text--headline {
  font-size: 16px;
  line-height: 1.5;
}

.output-empty {
  color: var(--t3);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
}

.char-counter {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--t4);
  letter-spacing: 0.06em;
  margin-top: 8px;
}

/* ── Feedback strip ─────────────────────────────────────────────────────── */
.feedback-strip {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--b1);
  transition: opacity 0.4s;
}

.feedback-label {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--t3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.feedback-options {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.feedback-btn {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.06em;
  padding: 4px 10px;
  border-radius: 3px;
  border: 1px solid var(--b2);
  background: none;
  color: var(--t3);
  cursor: pointer;
  transition: all 0.15s;
}

.feedback-btn:hover { border-color: var(--b3); color: var(--t2); }

.feedback-btn.primary:hover {
  border-color: rgba(52,211,153,0.4);
  color: var(--green);
}

.feedback-confirmed {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--green);
  letter-spacing: 0.08em;
}

.feedback-missing-input {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--b1);
  color: var(--t1);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  padding: 8px 10px;
  border-radius: 4px;
  outline: none;
  resize: none;
  margin-bottom: 8px;
}

.feedback-missing-input:focus { border-color: var(--gold); }

.feedback-actions {
  display: flex;
  gap: 8px;
}

/* ── Nudge banner ───────────────────────────────────────────────────────── */
#nudgeBanner {
  grid-column: 1 / -1;
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  background: var(--s2);
  border-bottom: 1px solid var(--b1);
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--t2);
}

.nudge-banner-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--gold);
  flex-shrink: 0;
}

.nudge-banner-text {
  flex: 1;
  line-height: 1.5;
}

.nudge-banner-text strong {
  color: var(--t1);
  font-weight: 500;
}

.nudge-banner-btn {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.06em;
  padding: 4px 10px;
  border: 1px solid var(--gold);
  border-radius: 3px;
  background: none;
  color: var(--gold);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.nudge-banner-btn:hover { background: rgba(232,166,64,0.08); }

.nudge-banner-dismiss {
  background: none;
  border: none;
  color: var(--t3);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 2px 4px;
  transition: color 0.15s;
}
.nudge-banner-dismiss:hover { color: var(--t2); }

/* ── Nudge panel (slide-in from right) ──────────────────────────────────── */
.nudge-panel {
  position: fixed;
  top: 0; right: 0;
  width: 420px; max-width: 90vw;
  height: 100vh;
  background: var(--s1);
  border-left: 1px solid var(--b1);
  z-index: 200;
  overflow-y: auto;
  padding: 24px;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.nudge-panel.open { transform: translateX(0); }

.nudge-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nudge-panel-title {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--gold);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.nudge-panel-skip {
  background: none;
  border: none;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--t3);
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: color 0.15s;
}
.nudge-panel-skip:hover { color: var(--t2); }

.nudge-panel-node {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 400;
  color: var(--t1);
  line-height: 1.3;
}

.nudge-section-label {
  font-family: 'DM Mono', monospace;
  font-size: 7px;
  color: var(--t4);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: -8px;
}

.nudge-reason-text {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--t2);
  line-height: 1.7;
}

.nudge-impacts {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.nudge-impact {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--t2);
  letter-spacing: 0.04em;
}

.nudge-divider {
  height: 1px;
  background: var(--b1);
  margin: 4px 0;
}

/* Question loading pulse */
.nudge-q-loading {
  display: flex;
  gap: 4px;
  align-items: center;
  height: 20px;
}

.nudge-q-loading span {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--t4);
  animation: nudge-pulse 1.2s ease-in-out infinite;
}
.nudge-q-loading span:nth-child(2) { animation-delay: 0.2s; }
.nudge-q-loading span:nth-child(3) { animation-delay: 0.4s; }

@keyframes nudge-pulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
  40% { opacity: 1; transform: scale(1.3); }
}

.nudge-q-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-style: italic;
  color: var(--t1);
  line-height: 1.5;
}

.nudge-answer-input {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--b1);
  color: var(--t1);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  line-height: 1.6;
  padding: 10px 12px;
  border-radius: 4px;
  outline: none;
  resize: vertical;
  transition: border-color 0.15s;
}
.nudge-answer-input:focus { border-color: var(--gold); }
.nudge-answer-input::placeholder { color: var(--t3); }

.nudge-year-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nudge-year-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--t3);
  letter-spacing: 0.06em;
  white-space: nowrap;
}

.nudge-year-input {
  flex: 1;
  background: var(--s2);
  border: 1px solid var(--b1);
  color: var(--t1);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 5px 10px;
  border-radius: 3px;
  outline: none;
  transition: border-color 0.15s;
}
.nudge-year-input:focus { border-color: var(--b3); }
.nudge-year-input::placeholder { color: var(--t3); }

.nudge-save-btn {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  padding: 9px 18px;
  border: 1px solid var(--gold);
  border-radius: 3px;
  background: rgba(232,166,64,0.08);
  color: var(--gold);
  cursor: pointer;
  transition: all 0.15s;
  align-self: flex-start;
}
.nudge-save-btn:hover:not(:disabled) { background: rgba(232,166,64,0.16); }
.nudge-save-btn:disabled { opacity: 0.5; cursor: default; }

.nudge-footer {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--t4);
  letter-spacing: 0.06em;
  line-height: 1.6;
  margin-top: auto;
}

/* ── Toast ──────────────────────────────────────────────────────────────── */
.career-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--s2);
  border: 1px solid var(--b2);
  color: var(--t1);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  padding: 8px 16px;
  border-radius: 4px;
  z-index: 300;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  backdrop-filter: blur(8px);
}

.career-toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Article empty state ────────────────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 40px;
  gap: 12px;
  text-align: center;
}

.empty-icon {
  font-size: 20px;
  color: var(--t4);
  margin-bottom: 4px;
}

.empty-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 400;
  color: var(--t2);
  letter-spacing: 0.01em;
}

.empty-desc {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--t3);
  line-height: 1.7;
  max-width: 320px;
  margin-bottom: 8px;
}

.action-btn.primary {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(232,166,64,0.06);
}
.action-btn.primary:hover { background: rgba(232,166,64,0.12); }

/* ── Article list ───────────────────────────────────────────────────────── */
.article-list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--b1);
  cursor: pointer;
  transition: background 0.15s;
  border-radius: 3px;
}
.article-list-item:hover { background: rgba(255,255,255,0.02); }

.status-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.draft { background: var(--t4); }
.status-dot.published { background: var(--green); }

.article-list-body { flex: 1; }

.article-list-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--t1);
  margin-bottom: 2px;
}

.article-list-meta {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--t3);
  letter-spacing: 0.04em;
}

.article-list-arrow {
  font-size: 12px;
  color: var(--t4);
  transition: color 0.15s;
}
.article-list-item:hover .article-list-arrow { color: var(--t2); }

/* ── New article panel ──────────────────────────────────────────────────── */
.back-btn {
  background: none;
  border: none;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--t3);
  cursor: pointer;
  letter-spacing: 0.06em;
  padding: 0;
  margin-bottom: 20px;
  display: block;
  transition: color 0.15s;
}
.back-btn:hover { color: var(--t2); }

.new-article-panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 680px;
}

.new-article-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--t1);
}

.new-article-subtitle {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--t3);
  line-height: 1.7;
  margin-top: -8px;
}

.thoughts-input {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--b1);
  color: var(--t1);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  line-height: 1.7;
  padding: 12px 14px;
  border-radius: 4px;
  outline: none;
  resize: vertical;
  transition: border-color 0.15s;
}
.thoughts-input:focus { border-color: var(--gold); }
.thoughts-input::placeholder { color: var(--t3); font-size: 12px; }

.suggestions-label {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--t3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.idea-cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.idea-card {
  padding: 12px 14px;
  border: 1px solid var(--b1);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
  background: none;
}
.idea-card:hover { border-color: var(--b3); background: rgba(255,255,255,0.01); }
.idea-card.selected { border-color: var(--gold); background: rgba(232,166,64,0.04); }

.idea-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--t1);
  margin-bottom: 4px;
}

.idea-premise {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  color: var(--t2);
  line-height: 1.6;
  margin-bottom: 8px;
}

.idea-nodes {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.idea-node-tag {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--t3);
  border: 1px solid var(--b1);
  padding: 2px 6px;
  border-radius: 2px;
}

/* ── Article editor ─────────────────────────────────────────────────────── */
.editor-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.editor-title {
  flex: 1;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 400;
  color: var(--t1);
  outline: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.15s;
  min-width: 120px;
}
.editor-title:focus { border-bottom-color: var(--b2); }

.editor-meta {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--t3);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

#saveIndicator {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.06em;
  transition: color 0.15s;
}

.article-editor-body {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  line-height: 1.8;
  color: var(--t1);
  outline: none;
  min-height: 400px;
  white-space: pre-wrap;
  word-break: break-word;
  max-width: 680px;
}

.article-editor-body::placeholder { color: var(--t3); }

.editor-footer {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--t4);
  letter-spacing: 0.08em;
  margin-top: 32px;
  padding-top: 12px;
  border-top: 1px solid var(--b1);
  max-width: 680px;
}

.editor-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}

/* ── Selection enhancement menu ─────────────────────────────────────────── */
.selection-menu {
  position: absolute;
  z-index: 200;
  display: none;
  gap: 2px;
  background: var(--s2);
  border: 1px solid var(--b2);
  border-radius: 4px;
  padding: 4px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

.sel-action-btn {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.06em;
  padding: 5px 10px;
  border-radius: 3px;
  border: none;
  background: none;
  color: var(--t2);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.1s;
}
.sel-action-btn:hover { background: var(--b1); color: var(--t1); }
.sel-action-btn:first-child:hover { color: var(--gold); }

.sel-loading {
  padding: 5px 14px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 0.2em;
}

/* ── Review panel ───────────────────────────────────────────────────────── */
.review-panel {
  position: fixed;
  right: 0; top: 44px; bottom: 0;
  width: 340px;
  background: var(--s1);
  border-left: 1px solid var(--b2);
  z-index: 50;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  animation: slideInRight 0.3s ease;
}

@keyframes slideInRight {
  from { transform: translateX(100%); }
  to   { transform: translateX(0); }
}

.review-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--b1);
  flex-shrink: 0;
}

.review-title {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--gold);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.review-close {
  background: none; border: none; color: var(--t3);
  cursor: pointer; font-size: 14px; padding: 2px 6px;
}
.review-close:hover { color: var(--t1); }

.review-loading {
  padding: 24px 16px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--t3);
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-dots {
  display: flex;
  gap: 4px;
}
.review-dots span {
  width: 4px; height: 4px;
  background: var(--gold);
  border-radius: 50%;
  animation: nudge-pulse 1.4s ease-in-out infinite;
}
.review-dots span:nth-child(2) { animation-delay: 0.2s; }
.review-dots span:nth-child(3) { animation-delay: 0.4s; }

.review-observations { padding: 16px; }

.review-obs {
  background: var(--s2);
  border: 1px solid var(--b1);
  border-radius: 4px;
  padding: 12px;
  margin-bottom: 10px;
  transition: opacity 0.3s;
}
.review-obs.applied { opacity: 0.4; }

.obs-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.obs-type {
  font-family: 'DM Mono', monospace;
  font-size: 7px; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 2px;
}
.obs-type.voice       { color: var(--gold);   border: 1px solid rgba(232,166,64,0.3); }
.obs-type.specificity { color: var(--blue);   border: 1px solid rgba(96,165,250,0.3); }
.obs-type.structure   { color: var(--purple); border: 1px solid rgba(167,139,250,0.3); }

.obs-apply-btn {
  font-family: 'DM Mono', monospace; font-size: 7px;
  letter-spacing: 0.08em; padding: 3px 8px; border-radius: 3px;
  border: 1px solid var(--b2); background: none; color: var(--t3);
  cursor: pointer; transition: all 0.15s;
}
.obs-apply-btn:hover { border-color: var(--gold); color: var(--gold); }

.obs-location {
  font-size: 10px; color: var(--t3); font-style: italic;
  margin-bottom: 6px; font-family: 'Cormorant Garamond', serif;
}
.obs-issue     { font-size: 11px; color: var(--t2); margin-bottom: 6px; }
.obs-suggestion {
  font-size: 11px; color: var(--t1); line-height: 1.6;
  border-left: 2px solid var(--gold); padding-left: 8px;
}

.review-overall {
  margin: 0 16px 16px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px; font-style: italic; color: var(--t2);
  border-top: 1px solid var(--b1); padding-top: 14px;
  line-height: 1.6;
}

/* ── Chat assist split-panel layout ─────────────────────────────────────── */
.panel-container {
  display: flex;
  gap: 0;
  align-items: flex-start;
  transition: gap 0.2s ease;
}

.panel-container.chat-assist-open {
  gap: 16px;
}

.panel-main {
  flex: 1;
  min-width: 0;
}

/* ── Chat assist panel ───────────────────────────────────────────────────── */
.chat-assist-panel {
  width: 340px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--b2);
  border-radius: 8px;
  background: var(--s1);
  height: calc(100vh - 120px);
  position: sticky;
  top: 20px;
}

.chat-assist-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--b1);
  flex-shrink: 0;
}

.chat-assist-title {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 0.05em;
}

.chat-assist-close {
  background: none;
  border: none;
  color: var(--t3);
  cursor: pointer;
  font-size: 12px;
  padding: 0;
}
.chat-assist-close:hover { color: var(--t1); }

.chat-assist-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.chat-assist-hint {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--t3);
  line-height: 1.8;
}

.chat-bubble {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 100%;
}

.chat-bubble-user .bubble-content {
  background: var(--s2);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  color: var(--t1);
  align-self: flex-end;
  max-width: 90%;
}

.chat-bubble-assistant .bubble-content {
  font-size: 13px;
  color: var(--t1);
  line-height: 1.6;
  white-space: pre-wrap;
}

.chat-assist-apply {
  align-self: flex-start;
  background: none;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 4px;
  letter-spacing: 0.05em;
  transition: all 0.15s;
}
.chat-assist-apply:hover { background: var(--gold); color: var(--bg); }

.chat-assist-input-row {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--b1);
  flex-shrink: 0;
}

.chat-assist-input {
  flex: 1;
  background: var(--s2);
  border: 1px solid var(--b2);
  border-radius: 6px;
  color: var(--t1);
  font-size: 13px;
  padding: 8px 10px;
  resize: none;
  font-family: inherit;
  line-height: 1.5;
}
.chat-assist-input:focus {
  outline: none;
  border-color: var(--gold);
}

.chat-assist-send {
  background: var(--gold);
  color: var(--bg);
  border: none;
  border-radius: 6px;
  width: 32px;
  cursor: pointer;
  font-size: 14px;
  flex-shrink: 0;
  align-self: flex-end;
  height: 36px;
  transition: opacity 0.15s;
}
.chat-assist-send:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<!-- ── Workspace shell ────────────────────────────────────────────────────── -->
<div id="workspace">

  <!-- Top bar (full width) -->
  <div id="workspaceTopbar">
    <div class="topbar-brand">
      <div class="topbar-mark"></div>
      <span class="topbar-name">Career OS</span>
    </div>
    <div class="topbar-actions">
      <div class="topbar-avatar" id="userBadge">You</div>
    </div>
  </div>

  <!-- Nudge banner slot — empty, display:none; populated by doc 12c -->
  <div id="nudgeBanner" class="nudge-banner" style="display:none;">
    <!-- populated by doc 12c -->
  </div>

  <!-- Left navigation -->
  <nav id="workspaceNav">
    <!-- rendered by WorkspaceNav.js -->
  </nav>

  <!-- Main content panel -->
  <main id="mainPanel">
    <!-- rendered by navigateTo() -->
  </main>

</div>

<!-- ── Graph full-screen container ────────────────────────────────────────── -->
<div id="graphContainer">
  <div class="graph-placeholder">
    <div class="graph-placeholder-icon">◈</div>
    <div class="graph-placeholder-label">
      Career Graph<br>
      <span style="color:var(--t4);">full view — coming soon</span>
    </div>
  </div>
</div>

<!-- Graph back button (fixed, shown when graph is open) -->
<button id="graphBackBtn">← Back to workspace</button>

<!-- ── Module entry ────────────────────────────────────────────────────────── -->
<script type="module" src="frontend/workspace.js"></script>

</body>
